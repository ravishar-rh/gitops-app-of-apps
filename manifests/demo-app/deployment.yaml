apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: demo-app
  labels:
    app: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: demo-app
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "--- Demo App Started ---"
              echo "DB_HOST=$DB_HOST"
              echo "DB_PORT=$DB_PORT"
              echo "DB_NAME=$DB_NAME"
              echo "DB_USERNAME=$DB_USERNAME"
              echo "DB_PASSWORD is set: $([ -n \"$DB_PASSWORD\" ] && echo yes || echo no)"
              echo "--- Secrets loaded from AWS Secrets Manager via ESO ---"
              sleep infinity
          envFrom:
            - secretRef:
                name: demo-app-db-creds
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
