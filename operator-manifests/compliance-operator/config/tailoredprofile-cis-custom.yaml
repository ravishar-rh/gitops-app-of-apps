# ROSA HCP: extend a Node profile (Platform profiles are not available).
apiVersion: compliance.openshift.io/v1alpha1
kind: TailoredProfile
metadata:
  name: cis-custom
  namespace: openshift-compliance
  annotations:
    compliance.openshift.io/product-type: Node
spec:
  extends: ocp4-cis-node
  title: Customized CIS Benchmark Profile (ROSA HCP)
  description: >-
    CIS node benchmark with site-specific rule adjustments for ROSA HCP.
    Modify the disableRules and enableRules lists to match
    your organization's requirements.
  disableRules:
    - name: ocp4-scc-limit-container-allowed-capabilities
      rationale: Third-party software requires custom SCC with additional capabilities
  # enableRules:
  #   - name: ocp4-some-additional-rule
  #     rationale: Required by internal security policy
