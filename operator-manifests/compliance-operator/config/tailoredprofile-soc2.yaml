# ROSA HCP: extend a Node profile (Platform profiles are not available).
apiVersion: compliance.openshift.io/v1alpha1
kind: TailoredProfile
metadata:
  name: soc2-technical-baseline
  namespace: openshift-compliance
  annotations:
    compliance.openshift.io/product-type: Node
spec:
  extends: ocp4-cis-node
  title: "OpenShift SOC 2 Tailored Infrastructure Profile (ROSA HCP)"
  description: >-
    Aggregated node rules mapped to SOC 2 Common Criteria for ROSA HCP.
    Uses CIS node as the baseline; control-plane / Platform checks are
    out of scope because the hosted control plane is Red Hat managed.
  disableRules:
    - name: ocp4-unnecessary-rule-example
      rationale: "This technical configuration is handled by our cloud provider's underlying IAM layer."
  manualRules:
    - name: ocp4-scc-limit-container-allowed-capabilities
      rationale: "Auditor must manually verify third-party security exceptions."
