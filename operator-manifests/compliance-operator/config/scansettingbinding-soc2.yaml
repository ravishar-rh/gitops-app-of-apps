# ROSA HCP: map SOC 2 controls to available Node profiles only.
apiVersion: compliance.openshift.io/v1alpha1
kind: ScanSettingBinding
metadata:
  name: soc2-compliance-mapping
  namespace: openshift-compliance
  labels:
    internal-control-id: SOC2-CC6-LOGICAL-ACCESS
profiles:
  - apiGroup: compliance.openshift.io/v1alpha1
    kind: Profile
    name: ocp4-cis-node
  - apiGroup: compliance.openshift.io/v1alpha1
    kind: Profile
    name: ocp4-moderate-node
settingsRef:
  apiGroup: compliance.openshift.io/v1alpha1
  kind: ScanSetting
  name: default
