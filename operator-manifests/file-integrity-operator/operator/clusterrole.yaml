apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-file-integrity-manager
rules:
  - apiGroups:
      - fileintegrity.openshift.io
    resources:
      - fileintegrities
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
