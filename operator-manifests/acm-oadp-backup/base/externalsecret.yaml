# ROSA HCP (STS/IRSA): store the OADP IAM role ARN and region in AWS Secrets
# Manager. Do not use long-lived access keys on ROSA.
#
# AWS Secrets Manager JSON at REPLACE_ME_AWS_SECRET_NAME:
#   {
#     "role_arn": "arn:aws:iam::123456789012:role/<cluster>-acm-oadp",
#     "region": "us-east-1"
#   }
#
# The role_arn must match REPLACE_ME_OADP_IAM_ROLE_ARN on the OADP Subscription
# and the IAM trust policy in examples/rosa-oadp-trust-policy.json.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloud-credentials
  namespace: open-cluster-management-backup
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: cloud-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        cloud: |
          [default]
          role_arn = {{ .role_arn }}
          web_identity_token_file = /var/run/secrets/openshift/serviceaccount/token
          region = {{ .region }}
  data:
    - secretKey: role_arn
      remoteRef:
        key: REPLACE_ME_AWS_SECRET_NAME
        property: role_arn
    - secretKey: region
      remoteRef:
        key: REPLACE_ME_AWS_SECRET_NAME
        property: region
