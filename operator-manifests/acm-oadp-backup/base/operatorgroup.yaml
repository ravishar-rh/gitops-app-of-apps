# Same name the MultiClusterHub cluster-backup chart uses. If MCH already
# created this object, Argo CD will adopt it instead of duplicating it.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: redhat-oadp-operator-group
  namespace: open-cluster-management-backup
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  targetNamespaces:
    - open-cluster-management-backup
  upgradeStrategy: Default
